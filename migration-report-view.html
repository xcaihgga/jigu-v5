<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据迁移报告 - Migration Report</title>
<style>
:root {
  --bg-brand: #4B3FE3;
  --bg-brand-hover: #6A6FFF;
  --bg-brand-active: #3F31C6;
  --bg-brand-popup: rgba(170, 183, 255, 0.36);
  --bg-base-default: #FFFFFF;
  --bg-base-secondary: #F5F5F5;
  --bg-base-tertiary: #E5E5E5;
  --text-default: #171717;
  --text-secondary: #404040;
  --text-tertiary: #737373;
  --text-disabled: #A1A1A1;
  --text-onbrand: #FFFFFF;
  --border-neutral-l1: rgba(115, 115, 115, 0.12);
  --border-neutral-l2: rgba(115, 115, 115, 0.18);
  --status-success-default: #15A877;
  --status-success-surface-l1: rgba(64, 176, 139, 0.12);
  --status-error-default: #E8463A;
  --status-error-surface-l1: rgba(232, 70, 58, 0.12);
  --status-warning-default: #E27900;
  --status-warning-surface-l1: rgba(226, 121, 0, 0.12);
  --status-primary-default: #2F74FF;
  --status-primary-surface-l1: rgba(47, 116, 255, 0.12);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  --radius-2xl: 16px;
  --radius-full: 999px;
  --font-family-default: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-family-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow-sm: 0 1px 2px rgba(17,17,17,0.04);
  --shadow-md: 0 4px 12px -2px rgba(17,17,17,0.08);
  --shadow-lg: 0 12px 32px -8px rgba(75,63,227,0.12);
  --gradient-brand: linear-gradient(135deg, #4B3FE3 0%, #6A6FFF 100%);
  --gradient-success: linear-gradient(135deg, #15A877 0%, #2FB287 100%);
  --gradient-error: linear-gradient(135deg, #E8463A 0%, #EA574C 100%);
  --gradient-warning: linear-gradient(135deg, #E27900 0%, #F39A35 100%);
  --gradient-info: linear-gradient(135deg, #2F74FF 0%, #4C88FF 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-family-default);
  background: linear-gradient(180deg, #F5F5FF 0%, #FAFAFF 40%, #FFFFFF 100%);
  min-height: 100vh;
  color: var(--text-default);
  line-height: 1.5;
  padding: 20px;
  max-width: 960px;
  margin: 0 auto;
}

.header {
  text-align: center;
  padding: 32px 20px 24px;
  background: var(--gradient-brand);
  border-radius: 20px;
  color: white;
  margin-bottom: 24px;
  box-shadow: var(--shadow-lg);
}

.header h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.header .subtitle {
  font-size: 14px;
  opacity: 0.9;
  line-height: 1.5;
}

.header .meta {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.header .meta-item {
  background: rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 13px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 12px;
}

.status-badge.healthy { background: rgba(255,255,255,0.25); color: white; }
.status-badge.degraded { background: rgba(254,169,0,0.3); color: white; }
.status-badge.error { background: rgba(232,70,58,0.3); color: white; }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* 概览卡片 */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.summary-card {
  background: var(--bg-base-secondary);
  border-radius: var(--radius-lg);
  padding: 18px 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-neutral-l1);
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
}

.summary-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.summary-card .icon-wrap {
  width: 44px;
  height: 44px;
  margin: 0 auto 10px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.summary-card .icon-wrap svg { width: 22px; height: 22px; }

.summary-card.success .icon-wrap { background: var(--status-success-surface-l1); color: var(--status-success-default); }
.summary-card.error .icon-wrap { background: var(--status-error-surface-l1); color: var(--status-error-default); }
.summary-card.warning .icon-wrap { background: var(--status-warning-surface-l1); color: var(--status-warning-default); }
.summary-card.info .icon-wrap { background: var(--status-primary-surface-l1); color: var(--status-primary-default); }
.summary-card.brand .icon-wrap { background: var(--bg-brand-popup); color: var(--bg-brand); }

.summary-card .value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-default);
  line-height: 1.1;
  margin-bottom: 4px;
}

.summary-card .value .unit {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-tertiary);
}

.summary-card .label {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* 筛选标签栏 */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.filter-bar::-webkit-scrollbar { height: 0; }

.filter-tab {
  flex-shrink: 0;
  padding: 10px 18px;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-full);
  background: var(--bg-base-secondary);
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}

.filter-tab:hover {
  border-color: var(--bg-brand);
  color: var(--bg-brand);
}

.filter-tab.active {
  background: var(--bg-brand);
  color: white;
  border-color: var(--bg-brand);
  font-weight: 600;
}

.filter-tab .count-badge {
  background: rgba(0,0,0,0.12);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
}

.filter-tab:not(.active) .count-badge {
  background: var(--border-neutral-l1);
  color: var(--text-tertiary);
}

/* 导出按钮 */
.export-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.export-btn {
  flex-shrink: 0;
  padding: 10px 18px;
  background: var(--gradient-brand);
  color: white;
  border: none;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  box-shadow: var(--shadow-sm);
}

.export-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.export-btn:active {
  transform: translateY(0);
}

.export-btn svg {
  width: 16px;
  height: 16px;
}

.export-info {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-left: auto;
}

.export-toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--status-success-default);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  transform: translateX(120%);
  transition: transform 0.3s ease;
}

.export-toast.show {
  transform: translateX(0);
}

.export-toast.error {
  background: var(--status-error-default);
}

/* 分类分组 */
.section {
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border-neutral-l1);
}

.section-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-default);
}

.section-badge {
  background: var(--bg-brand-popup);
  color: var(--bg-brand);
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
}

/* 数据列表 */
.data-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.data-item {
  background: var(--bg-base-secondary);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  border: 1px solid var(--border-neutral-l1);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
  cursor: default;
}

.data-item:hover {
  border-color: var(--bg-brand);
  box-shadow: var(--shadow-sm);
}

.data-item .status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.data-item.success .status-indicator { background: var(--status-success-default); }
.data-item.error .status-indicator { background: var(--status-error-default); }
.data-item.warning .status-indicator { background: var(--status-warning-default); }

.data-item-content {
  flex: 1;
  min-width: 0;
}

.data-item-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-default);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.data-item-id {
  font-family: var(--font-family-mono);
  font-size: 12px;
  color: var(--bg-brand);
  background: var(--bg-brand-popup);
  padding: 1px 6px;
  border-radius: 4px;
}

.data-item-desc {
  font-size: 13px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.data-item-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  font-weight: 600;
  flex-shrink: 0;
}

.tag-success { background: var(--status-success-surface-l1); color: var(--status-success-default); }
.tag-error { background: var(--status-error-surface-l1); color: var(--status-error-default); }
.tag-warning { background: var(--status-warning-surface-l1); color: var(--status-warning-default); }
.tag-info { background: var(--status-primary-surface-l1); color: var(--status-primary-default); }

/* 计算抽检卡片 */
.spotcheck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
}

.spotcheck-item {
  background: var(--bg-base-secondary);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  border: 1px solid var(--border-neutral-l1);
  font-family: var(--font-family-mono);
  font-size: 12px;
}

.spotcheck-item .name {
  font-weight: 600;
  color: var(--text-default);
  margin-bottom: 4px;
  font-family: var(--font-family-default);
  font-size: 13px;
}

.spotcheck-item .result {
  font-size: 11px;
  color: var(--text-tertiary);
}

.spotcheck-item.success { border-left: 3px solid var(--status-success-default); }
.spotcheck-item.error { border-left: 3px solid var(--status-error-default); }

/* 自检区域 */
.selfcheck-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

.selfcheck-stat {
  background: var(--bg-base-secondary);
  border-radius: var(--radius-md);
  padding: 14px;
  text-align: center;
  border: 1px solid var(--border-neutral-l1);
}

.selfcheck-stat .stat-value {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.1;
}

.selfcheck-stat.valid .stat-value { color: var(--status-success-default); }
.selfcheck-stat.invalid .stat-value { color: var(--status-error-default); }
.selfcheck-stat.warnings .stat-value { color: var(--status-warning-default); }

.selfcheck-stat .stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-tertiary);
}

.empty-state .icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 12px;
  opacity: 0.4;
}

/* 进度条 */
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border-neutral-l1);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}

.progress-fill.success { background: var(--status-success-default); }
.progress-fill.error { background: var(--status-error-default); }
.progress-fill.warning { background: var(--status-warning-default); }

/* 来源列表 */
.source-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.source-tag {
  background: var(--bg-base-secondary);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  max-width: 100%;
}

/* 响应式 */
@media (max-width: 600px) {
  body { padding: 12px; }
  .header { padding: 24px 16px 20px; }
  .header h1 { font-size: 20px; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .summary-card .value { font-size: 24px; }
  .data-item { flex-wrap: wrap; }
  .data-item-tag { margin-left: auto; }
  .selfcheck-stats { grid-template-columns: 1fr 1fr; }
}

.fade-in {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 数据迁移报告</h1>
  <div class="subtitle">临床数据新架构迁移验证结果</div>
  <div id="statusBadge" class="status-badge degraded">
    <span class="status-dot"></span>
    <span id="statusText">降级运行</span>
  </div>
  <div class="meta">
    <span class="meta-item" id="genTime">—</span>
    <span class="meta-item" id="schemaInfo">Schema v1.0</span>
  </div>
</div>

<div class="summary-grid" id="summaryGrid"></div>

<div class="export-bar">
  <button class="export-btn" id="exportBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    导出 CSV
  </button>
  <span class="export-info" id="exportInfo">将导出当前筛选条件下的数据</span>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-tab active" data-filter="all">全部 <span class="count-badge" id="countAll">0</span></button>
  <button class="filter-tab" data-filter="success">成功 <span class="count-badge" id="countSuccess">0</span></button>
  <button class="filter-tab" data-filter="error">失败 <span class="count-badge" id="countError">0</span></button>
  <button class="filter-tab" data-filter="warning">警告 <span class="count-badge" id="countWarning">0</span></button>
</div>

<div id="contentArea">
  <div class="section" id="scalesSection">
    <div class="section-header">
      <div class="section-title">📋 量表迁移</div>
      <span class="section-badge" id="scalesBadge">0/0</span>
    </div>
    <div class="data-list" id="scalesList"></div>
  </div>

  <div class="section" id="protocolsSection">
    <div class="section-header">
      <div class="section-title">📄 协议迁移</div>
      <span class="section-badge" id="protocolsBadge">0/0</span>
    </div>
    <div class="data-list" id="protocolsList"></div>
  </div>

  <div class="section" id="spotcheckSection">
    <div class="section-header">
      <div class="section-title">🔒 计算逻辑抽样校验</div>
      <span class="section-badge" id="spotcheckBadge">0/0</span>
    </div>
    <div class="spotcheck-grid" id="spotcheckList"></div>
  </div>

  <div class="section" id="selfcheckSection">
    <div class="section-header">
      <div class="section-title">✅ 数据自检</div>
    </div>
    <div class="selfcheck-stats" id="selfcheckStats"></div>
  </div>

  <div class="section" id="sourcesSection">
    <div class="section-header">
      <div class="section-title">📚 数据来源</div>
    </div>
    <div id="sourcesContent">
      <div style="margin-bottom:14px;">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text-default);">量表来源 <span id="scSourceCount" style="color:var(--bg-brand);font-weight:400;"></span></div>
        <div class="source-list" id="scalesSources"></div>
      </div>
      <div>
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text-default);">协议来源 <span id="prSourceCount" style="color:var(--bg-brand);font-weight:400;"></span></div>
        <div class="source-list" id="protocolsSources"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============ 加载迁移报告数据 ============
const reportData = {"generatedAt":"2026-08-05T01:16:05.989Z","systemStatus":"degraded","scales":{"total":31,"migrated":31,"failed":0,"errors":[],"versions":["1.0.0"],"sources":["中华医学会疼痛学分会推荐","国际疼痛研究协会(IASP)推荐","初级保健疼痛评估工具","Vernon H, Mior S. The Neck Disability Index. J Manipulative Physiol Ther. 1991.","Japanese Orthopaedic Association","Fairbank JC et al. The Oswestry Low Back Pain Disability Questionnaire. Physiotherapy. 1980.","Roland M, Morris R. A study of the natural history of back pain. Part I. Spine. 1983.","University of California, Los Angeles","Constant CR, Murley AH. Clinical method of functional assessment of the shoulder. Clin Orthop. 1987.","Hudak PL et al. Development of an upper extremity outcome measure. Am J Ind Med. 1996.","Beaton DE et al. QuickDASH. J Hand Ther. 2005.","Cooney WP et al. Clinical evaluation of wrist disorders. J Bone Joint Surg. 1981.","Mayo Clinic Elbow Performance Score","Harris WH. Traumatic arthritis of the hip. J Bone Joint Surg. 1969.","Lysholm J, Gillquist J. Evaluation of knee ligament surgery results. Am J Sports Med. 1982.","Oxford Knee Score, 1998","International Knee Documentation Committee","American Orthopaedic Foot and Ankle Society","Foot and Ankle Ability Measure","Stratford PW et al. Patient-specific functional scale. Phys Ther. 1995.","Mahoney FI, Barthel DW. Functional evaluation: the Barthel Index. 1965.","Uniform Data System for Medical Rehabilitation","Berg KO et al. Measuring balance in the elderly. Can J Public Health. 1989.","Holden MK et al. Functional gait categories. Phys Ther. 1984.","Ware JE Jr et al. SF-12 Health Survey. 1996.","Kendall FP. Muscles: Testing and Function.","关节活动度测量标准","Modified Ashworth Scale","Spitzer RL et al. A brief measure for assessing generalized anxiety disorder. Arch Intern Med. 2006.","Kroenke K et al. The PHQ-9. J Gen Intern Med. 2001."]},"protocols":{"total":3,"migrated":3,"failed":0,"errors":[],"versions":["1.0.0"],"sources":["基于AACP指南与最新循证医学证据","基于中国脑卒中康复治疗指南与国际循证证据","基于OARSI指南和AAOS膝OA临床实践指南"]},"calculationSpotCheck":{"passed":6,"failed":0},"selfCheck":{"scaleValid":31,"scaleInvalid":0,"warnings":1,"protocolValid":3,"protocolInvalid":0}};

// ============ 状态数据（由报告推导） ============
const scaleStatus = reportData.scales.errors.map(e => ({
  id: e.id,
  name: e.name,
  status: 'error',
  errors: e.errors
}));

const protocolStatus = reportData.protocols.errors.map(e => ({
  id: e.id,
  name: e.name,
  status: 'error',
  message: e.message
}));

const passedScales = reportData.scales.migrated - reportData.scales.failed;
const passedProtocols = reportData.protocols.migrated - reportData.protocols.failed;
const totalWarnings = reportData.selfCheck.warnings || 0;
const spotCheckTotal = reportData.calculationSpotCheck.passed + reportData.calculationSpotCheck.failed;

// ============ 渲染函数 ============
function renderHeader() {
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  const time = document.getElementById('genTime');
  
  badge.className = 'status-badge ' + reportData.systemStatus;
  
  const statusMap = {
    'healthy': '✅ 系统健康',
    'degraded': '⚠️ 降级运行',
    'error': '❌ 系统错误'
  };
  text.textContent = statusMap[reportData.systemStatus] || reportData.systemStatus;
  
  const d = new Date(reportData.generatedAt);
  time.textContent = '📅 ' + d.toLocaleString('zh-CN', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function renderSummary() {
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = `
    <div class="summary-card success fade-in">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 11 18 11 15 21 9 3 6 13 2 13"/></svg>

        name: err.name,

      });
    }
  }
  
  // 警告项（通过自检 warnings 标识，这里简化处理）

    // 警告通过 selfCheck.warnings 计数体现，无具体条目

  }
  
  // 成功项

    const successCount = reportData.scales.migrated;
    if (reportData.scales.failed === 0) {
      items.push({

// ============ 筛选逻辑 ============
let currentFilter = 'all';

function applyFilter(filter) {
  currentFilter = filter;
  
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.filter === filter);
  });
  
  renderScaleList(filter);
  renderProtocolList(filter);
  updateExportInfo();
  
  // 警告筛选说明
  const warningItems = document.getElementById('warningNotice');
  if (filter === 'warning') {
    if (!warningItems) {
      const notice = document.createElement('div');
      notice.id = 'warningNotice';
      notice.style.cssText = 'background:var(--status-warning-surface-l1);border-left:3px solid var(--status-warning-default);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:14px;color:var(--text-2);margin-bottom:16px;line-height:1.6;';
      notice.innerHTML = `<strong style="color:var(--status-warning-default);">⚠️ 注意：</strong>迁移报告中共检测到 <strong>${reportData.selfCheck.warnings}</strong> 条警告，部分量表的来源字段使用了默认值回填（如"临床常规应用"），建议人工确认后进行二次修正。`;
      document.getElementById('contentArea').insertBefore(notice, document.getElementById('scalesSection'));
    }
  } else {
    if (warningItems) warningItems.remove();
  }
}

// ============ CSV 导出 ============
function exportToCSV() {
  const rows = [];
  const filter = currentFilter;
  
  // 构建数据行
  function addRow(category, id, name, status, description) {
    const statusMap = {
      'success': '成功',
      'error': '失败',
      'warning': '警告'
    };
    rows.push({
      '分类': category,
      'ID': id,
      '名称': name,
      '状态': statusMap[status] || status,
      '详细信息': description
    });
  }
  
  // 量表数据
  for (const err of reportData.scales.errors) {
    if (filter === 'all' || filter === 'error') {
      addRow('量表', err.id, err.name, 'error', err.errors.map(e => `[${e.severity}] ${e.field}: ${e.message}`).join('; '));
    }
  }
  
  if (filter === 'all' || filter === 'success') {
    const successCount = reportData.scales.migrated - reportData.scales.failed;
    if (successCount > 0) {
      addRow('量表', 'all', `${successCount} 个量表`, 'success', `共 ${reportData.scales.total} 个原始数据全部通过验证`);
    }
  }
  
  // 协议数据
  for (const err of reportData.protocols.errors) {
    if (filter === 'all' || filter === 'error') {
      addRow('协议', err.id, err.name, 'error', err.message);
    }
  }
  
  if (filter === 'all' || filter === 'success') {
    addRow('协议', 'all', `${reportData.protocols.migrated} 个协议`, 'success', `共 ${reportData.protocols.total} 个原始数据全部通过验证`);
  }
  
  // 警告数据
  if (filter === 'all' || filter === 'warning') {
    if (reportData.selfCheck.warnings > 0) {
      addRow('自检', 'warnings', '自检警告', 'warning', `检测到 ${reportData.selfCheck.warnings} 条警告，部分字段使用默认值回填`);
    }
  }
  
  // 计算抽检数据
  if (filter === 'all' || filter === 'success') {
    const spotCheckItems = [
      { id: 'vas', name: 'VAS 视觉模拟评分' },
      { id: 'nrs', name: 'NRS 数字疼痛评分' },
      { id: 'p4', name: 'P4 疼痛4量表' },
      { id: 'odi', name: 'ODI Oswestry 功能障碍' },
      { id: 'joa-lumbar', name: 'JOA 腰椎评分' },
      { id: 'dash', name: 'DASH 上肢功能' }
    ];
    for (const item of spotCheckItems) {
      addRow('计算抽检', item.id, item.name, 'success', '通过抽样校验');
    }
  }
  
  if (rows.length === 0) {
    showToast('当前筛选条件下没有可导出的数据', true);
    return;
  }
  
  // 生成 CSV
  const headers = Object.keys(rows[0]);
  const csvLines = [];
  
  // 添加 UTF-8 BOM for Excel 兼容
  csvLines.push('\uFEFF');
  
  csvLines.push(headers.join(','));
  
  for (const row of rows) {
    const values = headers.map(h => {
      let val = String(row[h] || '');
      // 转义双引号和换行符
      if (val.includes('"') || val.includes(',') || val.includes('\n')) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      return val;
    });
    csvLines.push(values.join(','));
  }
  
  csvLines.push('');
  csvLines.push(`# 导出时间: ${new Date().toLocaleString('zh-CN')}`);
  csvLines.push(`# 系统状态: ${reportData.systemStatus}`);
  csvLines.push(`# 筛选条件: ${getFilterLabel(filter)}`);
  csvLines.push(`# 数据来源: migration-report.json`);
  
  const csvContent = csvLines.join('\n');
  
  // 下载文件
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const d = new Date();
  const timestamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  link.href = url;
  link.download = `migration-report-${timestamp}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  
  showToast(`✅ 成功导出 ${rows.length} 条数据为 CSV 文件`);
}

function getFilterLabel(filter) {
  const labels = {
    'all': '全部',
    'success': '成功',
    'error': '失败',
    'warning': '警告'
  };
  return labels[filter] || filter;
}

function showToast(message, isError = false) {
  const existing = document.getElementById('exportToast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.id = 'exportToast';
  toast.className = 'export-toast' + (isError ? ' error' : '');
  toast.textContent = message;
  document.body.appendChild(toast);
  
  requestAnimationFrame(() => toast.classList.add('show'));
  
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

  document.getElementById('countAll').textContent = reportData.scales.total + reportData.protocols.total;

  document.getElementById('countError').textContent = reportData.scales.failed + reportData.protocols.failed;

// 绑定筛选事件
document.getElementById('filterBar').addEventListener('click', (e) => {
  const tab = e.target.closest('.filter-tab');
  if (tab) applyFilter(tab.dataset.filter);
});

// 绑定导出事件
document.getElementById('exportBtn').addEventListener('click', exportToCSV);

// 更新导出信息
function updateExportInfo() {
  const exportInfo = document.getElementById('exportInfo');
  const filter = currentFilter;
  const parts = [];
  
  if (filter === 'all') {
    parts.push(`量表 ${reportData.scales.total}`);
    parts.push(`协议 ${reportData.protocols.total}`);
    parts.push(`计算抽检 ${reportData.calculationSpotCheck.passed}`);
    if (reportData.selfCheck.warnings > 0) parts.push(`警告 ${reportData.selfCheck.warnings}`);
  } else if (filter === 'success') {
    parts.push(`量表 ${reportData.scales.migrated}`);
    parts.push(`协议 ${reportData.protocols.migrated}`);
    parts.push(`计算抽检 ${reportData.calculationSpotCheck.passed}`);
  } else if (filter === 'error') {
    parts.push(`量表失败 ${reportData.scales.failed}`);
    parts.push(`协议失败 ${reportData.protocols.failed}`);
  } else if (filter === 'warning') {
    parts.push(`警告 ${reportData.selfCheck.warnings}`);
  }
  
  exportInfo.textContent = `筛选「${getFilterLabel(filter)}」：${parts.join(' / ')} 条记录可导出`;
}

// 启动
renderHeader();
renderSummary();
updateFilterCounts();
applyFilter('all');
renderSpotCheck();
renderSelfCheck();
renderSources();
</script>
