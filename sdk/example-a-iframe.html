<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集成示例 A — iframe 嵌入</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
  h1 { font-size: 18px; color: #333; }
  .desc { color: #666; font-size: 13px; margin-bottom: 12px; }
  iframe {
    width: 100%;
    height: 80vh;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    background: #fff;
  }
</style>
</head>
<body>
  <h1>集成示例 A：iframe 嵌入</h1>
  <p class="desc">最简单的方式 —— 一行代码嵌入完整应用，无需处理依赖。</p>

  <!-- 核心代码：只需这一个 iframe -->
  <iframe
    src="https://xcaihgga.github.io/jigu-v5/"
    allowfullscreen
  ></iframe>
</body>
</html>
